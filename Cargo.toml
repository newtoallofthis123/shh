[package]
name = "shh"
version = "0.1.0"
edition = "2021"
description = "Keep env-var secrets in the macOS Keychain and load them into shells or child processes on demand."
license = "MIT"
repository = "https://github.com/newtoallofthis123/shh"
homepage = "https://github.com/newtoallofthis123/shh"
readme = "README.md"
keywords = ["keychain", "secrets", "env", "macos", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.79"
exclude = ["thoughts/", "docs/prototype.html"]

[[bin]]
name = "shh"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
inquire = "0.7"
anyhow = "1"
thiserror = "1"
serde_json = "1"
security-framework = { version = "3", features = ["OSX_10_15"] }
shellexpand = "3"
